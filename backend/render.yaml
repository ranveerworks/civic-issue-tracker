services:
  - type: web
    name: civic-issue-tracker-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://civic-issue-tracker.vercel.app,http://localhost:5173
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
